<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>長庚醫院醫用常用網頁 - 入口網站</title>
<style>
:root {
    --bg-1: #eef2ff; --bg-2: #f7f9fc; --bg-3: #e0f2fe;
    --ink: #172033; --ink-soft: #5b6472; --ink-faint: #8b93a1;
    --surface: rgba(255, 255, 255, 0.95); --surface-border: rgba(226, 232, 240, 0.9);
    --line: #e6eaf1; --brand: #0d9488; --brand-dark: #042f2e;
    --shadow-sm: 0 6px 18px rgba(15, 23, 42, 0.06); --shadow-md: 0 14px 34px rgba(15, 23, 42, 0.10);
    --radius-md: 16px;
}
* { box-sizing: border-box; }
body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    color: var(--ink); min-height: 100vh;
    background: linear-gradient(150deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
    background-attachment: fixed;
}
header { padding: 30px 20px 15px; text-align: center; }
.logo {
    width: 64px; height: 64px; margin: auto; border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--brand-dark), var(--brand));
    color: white; font-size: 28px; font-weight: 800; box-shadow: var(--shadow-md);
}
h1 { margin: 12px 0 4px; font-size: 26px; font-weight: 800; }
.subtitle { color: var(--ink-soft); font-size: 13.5px; margin-bottom: 15px; }

/* Navigation */
.tabs-nav-container { max-width: 1180px; margin: 0 auto 15px; padding: 0 20px; }
.tabs-nav { display: flex; gap: 8px; overflow-x: auto; border-bottom: 2px solid var(--line); padding-bottom: 6px; }
.tab-btn {
    padding: 10px 18px; border: 1px solid transparent; border-bottom: none;
    border-radius: 12px 12px 0 0; background: rgba(255, 255, 255, 0.6);
    color: var(--ink-soft); font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap;
}
.tab-btn:hover { background: #fff; color: var(--brand); }
.tab-btn.active { background: #fff; color: var(--brand); border-color: var(--line); border-bottom: 3px solid var(--brand); }

/* Controls */
.toolbar { max-width: 1180px; margin: 0 auto 20px; padding: 0 20px; display: flex; gap: 10px; flex-wrap: wrap; }
.search-box {
    flex: 1; min-width: 240px; padding: 12px 18px; border: 1px solid var(--line); border-radius: 12px;
    outline: none; background: var(--surface); font-size: 14.5px; box-shadow: var(--shadow-sm);
}
.btn {
    padding: 12px 18px; border: none; border-radius: 12px; background: var(--brand);
    color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.15s;
}
.btn:hover { opacity: 0.9; }
.btn-secondary { background: #64748b; }

main { width: min(1180px, 94%); margin: 0 auto 60px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; min-height: 80px; }

/* Cards */
.card {
    position: relative; display: flex; flex-direction: column; padding: 18px;
    border-radius: var(--radius-md); text-decoration: none; color: inherit; background: var(--surface);
    border: 1px solid var(--surface-border); box-shadow: var(--shadow-sm); transition: transform 0.15s, box-shadow 0.15s;
    cursor: grab;
}
.card:active { cursor: grabbing; }
.card.dragging { opacity: 0.4; transform: scale(0.98); }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.icon {
    width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    background: #ccfbf1; color: var(--brand); font-size: 16px; font-weight: 800;
}
.card-actions { display: flex; gap: 4px; }
.action-btn { background: none; border: none; cursor: pointer; font-size: 13px; color: var(--ink-faint); padding: 2px 6px; border-radius: 6px; }
.action-btn:hover { background: #e2e8f0; color: var(--ink); }
.card h3 { margin: 0 0 6px; font-size: 15px; font-weight: 700; word-break: break-word; }
.card p { margin: 0; color: var(--ink-soft); font-size: 12.5px; line-height: 1.5; word-break: break-word; }
.card-meta { margin-top: auto; padding-top: 10px; display: flex; justify-content: space-between; align-items: center; }
.account-badge { font-size: 11px; background: #f1f5f9; padding: 3px 8px; border-radius: 6px; color: var(--ink-soft); font-weight: 600; }
.card-link { font-size: 12px; font-weight: 700; color: var(--brand); text-decoration: none; display: flex; align-items: center; gap: 2px; }

footer { text-align: center; padding: 25px; color: var(--ink-faint); font-size: 12.5px; border-top: 1px solid var(--line); }
</style>
</head>
<body>

<header>
    <div class="logo">🩺</div>
    <h1>長庚醫院醫用常用網頁</h1>
    <p class="subtitle">長庚醫療體系・臨床雲端・UpToDate 與醫療資訊整合入口</p>
</header>

<div class="tabs-nav-container">
    <nav class="tabs-nav">
        <a href="index.html" class="tab-btn">吉米醫師常用網頁</a>
        <a href="delta.html" class="tab-btn">台達駐廠常用網頁</a>
        <a href="cgu.html" class="tab-btn">長庚大學常用網頁</a>
        <a href="ntsu.html" class="tab-btn">體育大學常用網頁</a>
        <a href="cgmh-med.html" class="tab-btn active">長庚醫院醫用常用網頁</a>
        <a href="cgmh-admin.html" class="tab-btn">長庚醫院行政常用網頁</a>
    </nav>
</div>

<div class="toolbar">
    <input id="search" class="search-box" type="search" placeholder="🔍 搜尋醫用卡片..." onkeyup="filterCards()">
    <button class="btn" onclick="addNewCard()">+ 新增卡片</button>
    <button class="btn btn-secondary" onclick="resetDefaultCards()">↺ 還原預設</button>
</div>

<main>
    <div id="cardGrid" class="grid"></div>
</main>

<footer>
    <strong>長庚醫院醫用常用網頁</strong> • 獨立分頁儲存機制。<br>© 2026 Jimmy Doctor
</footer>

<script>
const STORAGE_KEY = "tab_cgmh_med_cards_v1";

const defaultCards = [
    { id: "m1", title: "長庚雲端系統", desc: "長庚紀念醫院醫療雲端服務系統。", url: "https://cloud.cgmh.org.tw/", icon: "🏥", meta: "CGMH" },
    { id: "m2", title: "UpToDate 實證醫學", desc: "臨床決策支援與實證醫學查詢。", url: "https://www.uptodate.com", icon: "📚", meta: "jimmychen9" },
    { id: "m3", title: "臨床急診工具集", desc: "急診與臨床處置計算工具。", url: "https://cgmherlink-hub.github.io/ClinicalTool/", icon: "🩺", meta: "Clinical" }
];

let cards = loadCards();

function loadCards() {
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved ? JSON.parse(saved) : [...defaultCards];
}

function saveCards() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
}

function renderCards() {
    const grid = document.getElementById("cardGrid");
    grid.innerHTML = "";
    
    cards.forEach((card, index) => {
        const el = document.createElement("div");
        el.className = "card";
        el.draggable = true;
        el.dataset.index = index;
        
        el.innerHTML = `
            <div class="card-header">
                <div class="icon">${card.icon || '🩺'}</div>
                <div class="card-actions">
                    <button class="action-btn" onclick="editCard('${card.id}')" title="編輯">✏️</button>
                    <button class="action-btn" onclick="deleteCard('${card.id}')" title="刪除">🗑️</button>
                </div>
            </div>
            <h3>${escapeHtml(card.title)}</h3>
            <p>${escapeHtml(card.desc)}</p>
            <div class="card-meta">
                <span class="account-badge">${escapeHtml(card.meta || '醫療')}</span>
                <a href="${escapeHtml(card.url)}" target="_blank" class="card-link" onclick="event.stopPropagation()">開啟 ↗</a>
            </div>
        `;

        el.addEventListener("dragstart", handleDragStart);
        el.addEventListener("dragover", handleDragOver);
        el.addEventListener("drop", handleDrop);
        el.addEventListener("dragend", handleDragEnd);

        grid.appendChild(el);
    });
}

let draggedIndex = null;
function handleDragStart(e) { draggedIndex = +this.dataset.index; this.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; }
function handleDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = "move"; }
function handleDrop(e) {
    e.preventDefault();
    const targetIndex = +this.dataset.index;
    if (draggedIndex === null || draggedIndex === targetIndex) return;
    const draggedItem = cards.splice(draggedIndex, 1)[0];
    cards.splice(targetIndex, 0, draggedItem);
    saveCards();
    renderCards();
}
function handleDragEnd() { this.classList.remove("dragging"); draggedIndex = null; }

function editCard(id) {
    const card = cards.find(c => c.id === id);
    if (!card) return;
    const newTitle = prompt("修改名稱：", card.title); if (newTitle === null) return;
    const newUrl = prompt("修改網址：", card.url); if (newUrl === null) return;
    const newDesc = prompt("修改描述：", card.desc); if (newDesc === null) return;
    const newMeta = prompt("修改標籤：", card.meta); if (newMeta === null) return;

    card.title = newTitle.trim() || card.title;
    card.url = newUrl.trim() || card.url;
    card.desc = newDesc.trim() || card.desc;
    card.meta = newMeta.trim() || card.meta;

    saveCards();
    renderCards();
}

function addNewCard() {
    const title = prompt("卡片名稱：", "新醫用連結"); if (!title) return;
    const url = prompt("網址 (URL)：", "https://"); if (!url) return;
    const desc = prompt("描述：", "");
    const meta = prompt("標籤：", "醫療");

    cards.unshift({ id: Date.now().toString(), title: title.trim(), url: url.trim(), desc: desc ? desc.trim() : "", meta: meta ? meta.trim() : "醫療", icon: "💊" });
    saveCards();
    renderCards();
}

function deleteCard(id) {
    if (!confirm("確定要刪除這張卡片嗎？")) return;
    cards = cards.filter(c => c.id !== id);
    saveCards();
    renderCards();
}

function resetDefaultCards() {
    if (confirm("恢復預設長庚醫院醫用卡片嗎？")) {
        cards = [...defaultCards];
        saveCards();
        renderCards();
    }
}

function filterCards() {
    const query = document.getElementById("search").value.toLowerCase();
    document.querySelectorAll(".card").forEach(el => {
        el.style.display = el.innerText.toLowerCase().includes(query) ? "flex" : "none";
    });
}

function escapeHtml(str) {
    return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

renderCards();
</script>
</body>
</html>
